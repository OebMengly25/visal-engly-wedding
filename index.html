     Moul            -> Khmer headings

     Cormorant Garamond -> English body
     Montserrat      -> English labels / buttons
============================================================= -->

<style>
/* ============================================================
   1. THEME
============================================================ */
:root{
  --pearl-1:#E8DFCB;          /* light champagne            */
  --pearl-2:#D9CDB0;          /* deeper pearl beige         */
  --copper:#B8683F;           /* copper / rose-gold accent  */
  --copper-dark:#8a4526;      /* gradient end for headings  */
  --copper-light:#d98b5f;     /* gradient start for headings*/
  --ink:#5a4634;              /* soft brown body text       */
  --card-max:480px;           /* mobile-first card width    */
}

*{ margin:0; padding:0; box-sizing:border-box; }

html{ scroll-behavior:smooth; }

body{
  min-height:100vh;
  /* champagne shimmer background */
  background:
    radial-gradient(circle at 20% 20%, rgba(255,255,255,.55) 0, transparent 45%),
    radial-gradient(circle at 80% 70%, rgba(255,255,255,.35) 0, transparent 40%),
    linear-gradient(160deg, var(--pearl-1) 0%, var(--pearl-2) 100%);
  background-attachment:fixed;
  color:var(--ink);
  font-family:'Cormorant Garamond', serif;
  display:flex; justify-content:center;
  padding:18px 10px 48px;
}

/* light sparkle overlay across the whole page */
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:
    radial-gradient(rgba(255,255,255,.9) 1px, transparent 1.6px),
    radial-gradient(rgba(216,143,95,.35) 1px, transparent 1.6px),
    radial-gradient(rgba(255,255,255,.7) 1px, transparent 1.6px);
  background-size:220px 220px, 160px 160px, 340px 340px;
  background-position:0 0, 60px 90px, 130px 40px;
  opacity:.35; mix-blend-mode:screen;
}

/* ============================================================
   2. CARD SHELL + DOUBLE BORDER
============================================================ */
.card{
  position:relative; z-index:1;
  width:100%; max-width:var(--card-max);
  background:linear-gradient(170deg,#f4eee0 0%, var(--pearl-1) 45%, #e3d7bd 100%);
  border:2px solid var(--copper);
  outline:1px solid rgba(184,104,63,.45);
  outline-offset:5px;                 /* second border of the double frame */
  box-shadow:0 18px 50px rgba(90,60,30,.30), 0 4px 14px rgba(90,60,30,.18);
  padding:30px 22px 34px;
  text-align:center;
  overflow:hidden;
}

/* inner hairline of the frame */
.card::before{
  content:""; position:absolute; inset:10px;
  border:1px solid rgba(184,104,63,.5);
  pointer-events:none; z-index:2;
}

/* ============================================================
   3. SVG ORNAMENTS (corners + top/bottom scrolls)
============================================================ */
.orn{ position:absolute; z-index:3; color:var(--copper); opacity:.9; }
.orn svg{ display:block; width:58px; height:58px; fill:currentColor; stroke:currentColor; }

.orn.tl{ top:8px;  left:8px;  transform:rotate(0deg); }
.orn.tr{ top:8px;  right:8px; transform:rotate(90deg); }
.orn.bl{ bottom:8px; left:8px;  transform:rotate(-90deg); }
.orn.br{ bottom:8px; right:8px; transform:rotate(180deg); }

.orn.scroll{
  position:static; display:block; margin:0 auto; color:var(--copper);
}
.orn.scroll svg{ width:170px; height:34px; }

/* ============================================================
   4. COVER (opening animation)
============================================================ */
#cover{
  position:fixed; inset:0; z-index:50;
  background:
    radial-gradient(circle at 50% 30%, rgba(255,255,255,.5), transparent 55%),
    linear-gradient(160deg, var(--pearl-1), var(--pearl-2));
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:18px; text-align:center; padding:30px;
  transition:opacity 1s ease, transform 1s ease;
}
#cover::before{
  content:""; position:absolute; inset:14px;
  border:2px solid var(--copper); outline:1px solid rgba(184,104,63,.4); outline-offset:4px;
}
#cover.opened{ opacity:0; transform:scale(1.04); pointer-events:none; }

.cover-title-km{ font-family:'Moul',serif; color:var(--copper); font-size:20px; line-height:1.9; }
.cover-names{ font-family:'Great Vibes',cursive; font-size:52px; background:linear-gradient(120deg,var(--copper-light),var(--copper-dark)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }

#tapOpen{
  margin-top:8px; padding:14px 34px;
  font-family:'Montserrat',sans-serif; font-size:14px; letter-spacing:3px; text-transform:uppercase;
  color:#f6efe0; background:linear-gradient(135deg,var(--copper-light),var(--copper));
  border:none; border-radius:40px; cursor:pointer;
  box-shadow:0 6px 18px rgba(184,104,63,.45);
  animation:pulse 2.2s infinite;
}
@keyframes pulse{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }

/* staggered reveal after opening */
.reveal{ opacity:0; transform:translateY(22px); transition:opacity .9s ease, transform .9s ease; }
body.opened .reveal{ opacity:1; transform:none; }
body.opened .reveal:nth-of-type(1){ transition-delay:.15s }
body.opened .reveal:nth-of-type(2){ transition-delay:.35s }
body.opened .reveal:nth-of-type(3){ transition-delay:.55s }
body.opened .reveal:nth-of-type(4){ transition-delay:.75s }
body.opened .reveal:nth-of-type(5){ transition-delay:.95s }
body.opened .reveal:nth-of-type(6){ transition-delay:1.15s }

/* ============================================================
   5. TYPOGRAPHY & SECTIONS
============================================================ */
.km-head{ font-family:'Moul',serif; font-size:17px; line-height:2; color:var(--copper); }
.en-head{
  font-family:'Montserrat',sans-serif; font-weight:600; letter-spacing:4px; text-transform:uppercase; font-size:15px;
  background:linear-gradient(120deg,var(--copper-light),var(--copper-dark));
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
}
.section{ margin:26px 0; }
.divider{ width:60%; margin:22px auto; border:none; border-top:1px solid rgba(184,104,63,.5); }

.km-text{ font-family:'Noto Serif Khmer',serif; font-size:15px; line-height:2; }
.parents{ font-family:'Battambang',serif; font-size:15.5px; line-height:2; color:var(--ink); }
.km-couple{ font-family:'Moul',serif; font-size:20px; line-height:2; color:var(--copper); }
.script-names{
  font-family:'Great Vibes',cursive; font-size:46px; line-height:1.3;
  background:linear-gradient(120deg,var(--copper-light),var(--copper-dark));
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
}
.en-body{ font-family:'Cormorant Garamond',serif; font-size:17px; line-height:1.75; }
.en-label{ font-family:'Montserrat',sans-serif; font-size:12px; letter-spacing:2.5px; text-transform:uppercase; color:var(--copper); }

/* date block */
.date-block{
  font-family:'Montserrat',sans-serif; letter-spacing:3px; color:var(--copper);
  display:flex; justify-content:center; align-items:center; gap:10px; flex-wrap:wrap;
  font-size:14px; font-weight:600;
}
.date-block .sep{ opacity:.5 }
.date-time{ font-family:'Cormorant Garamond',serif; font-size:22px; letter-spacing:2px; color:var(--ink); margin-top:6px; }

/* buttons */
.btn{
  display:inline-block; margin:6px 5px; padding:11px 22px;
  font-family:'Montserrat',sans-serif; font-size:12px; letter-spacing:1.5px; text-transform:uppercase;
  color:#f6efe0; background:linear-gradient(135deg,var(--copper-light),var(--copper));
  border:none; border-radius:30px; cursor:pointer; text-decoration:none;
  box-shadow:0 4px 12px rgba(184,104,63,.35);
  transition:transform .2s ease;
}
.btn:hover{ transform:translateY(-2px) }
.btn.ghost{ color:var(--copper); background:transparent; border:1px solid var(--copper); box-shadow:none; }

/* QR code image */
.qr-img{
  width:210px; height:210px; object-fit:contain;
  margin:14px auto; display:block;
  border:2px solid var(--copper); border-radius:12px;
  background:#f5efe1; padding:6px;
}

/* countdown */
.countdown{ display:flex; justify-content:center; gap:10px; margin-top:12px; flex-wrap:wrap; }
.cd-box{
  min-width:62px; padding:10px 6px; border:1px solid rgba(184,104,63,.55); border-radius:10px;
  background:rgba(255,255,255,.35);
}
.cd-num{ font-family:'Montserrat',sans-serif; font-weight:600; font-size:22px; color:var(--copper); }
.cd-lab{ font-family:'Montserrat',sans-serif; font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--ink); }

/* contact links */
.tel-list{ display:flex; flex-direction:column; gap:10px; margin-top:10px; }
.tel-link{ font-family:'Montserrat',sans-serif; font-size:16px; letter-spacing:2px; color:var(--copper); text-decoration:none; }

/* floating controls */
.float-controls{ position:fixed; top:14px; right:14px; z-index:60; display:flex; gap:8px; }
.icon-btn{
  width:44px; height:44px; border-radius:50%;
  border:1px solid var(--copper); background:rgba(255,255,255,.7);
  color:var(--copper); font-size:18px; cursor:pointer;
  box-shadow:0 3px 10px rgba(90,60,30,.2);
}

/* language filter:  body.lang-english hides khmer, body.lang-khmer hides english */
[data-lang]{ display:revert; }
body.lang-english [data-lang="khmer"]{ display:none !important }
body.lang-khmer   [data-lang="english"]{ display:none !important }
.lang-switch{ position:fixed; top:14px; left:14px; z-index:60; display:flex; border-radius:22px; overflow:hidden; box-shadow:0 3px 10px rgba(90,60,30,.2); }
.lang-switch button{ padding:9px 14px; border:none; cursor:pointer; font-family:'Montserrat',sans-serif; font-size:12px; background:rgba(255,255,255,.75); color:var(--copper); }
.lang-switch button.active{ background:var(--copper); color:#f6efe0; }

/* small screens */
@media (max-width:380px){
  .cover-names{ font-size:42px }
  .script-names{ font-size:38px }
}
</style>

   FILL ALL TEXT FROM CONFIG  (elements carry data-t="key")

document.querySelectorAll("[data-t]").forEach(el=>{

/* ============================================================
   COVER OPENING ANIMATION
============================================================ */
const cover = document.getElementById("cover");
function openCard(){
  cover.classList.add("opened");
  document.body.classList.add("opened");
  setTimeout(()=>cover.remove(), 1100);
}
document.getElementById("tapOpen").addEventListener("click", openCard);

/* ============================================================
   COUNTDOWN — 4 Dec 2026, 17:00 Asia/Phnom_Penh (= UTC+7)
============================================================ */
const TARGET = new Date("2026-12-04T17:00:00+07:00").getTime();
function tick(){
  let diff = TARGET - Date.now();
  if(diff < 0) diff = 0;
  const d = Math.floor(diff/864e5),
        h = Math.floor(diff/36e5)%24,
        m = Math.floor(diff/6e4)%60,
        s = Math.floor(diff/1e3)%60;
  cdD.textContent = d; cdH.textContent = h; cdM.textContent = m; cdS.textContent = s;
}
tick(); setInterval(tick, 1000);

  ].join("\r\n");
  const a = Object.assign(document.createElement("a"),{
    href:URL.createObjectURL(new Blob([ics],{type:"text/calendar"})),
    download:"Visal-EngLy-Wedding.ics"
  });
  a.click(); URL.revokeObjectURL(a.href);
});

/* ============================================================
   BACKGROUND MUSIC TOGGLE  (placeholder src)
============================================================ */
const bgm = document.getElementById("bgm"), musicBtn = document.getElementById("musicBtn");
if(CONFIG.musicSrc){ bgm.src = CONFIG.musicSrc; } else { musicBtn.style.opacity = .45; }
musicBtn.addEventListener("click", ()=>{
  if(!CONFIG.musicSrc) return;              // no file yet — button is a placeholder
  if(bgm.paused){ bgm.play(); musicBtn.textContent = "🔊"; }
  else{ bgm.pause(); musicBtn.textContent = "🔈"; }
});

/* ============================================================
   BILINGUAL TOGGLE:  khmer / english / both
============================================================ */
document.querySelectorAll("[data-set-lang]").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.body.className = "opened lang-" + btn.dataset.setLang;
    document.querySelectorAll("[data-set-lang]").forEach(b=>b.classList.toggle("active", b===btn));
  });
});
</script>
</body>
